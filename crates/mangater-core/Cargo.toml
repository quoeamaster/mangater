[package]
name = "mangater-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core engine for manga downloading, orchestration, and plugin execution"

repository = "https://github.com/quoeamaster/mangater/tree/main/crates/mangater-core"
homepage = "https://github.com/quoeamaster/mangater/tree/main/crates/mangater-core"
documentation = "https://crates.io/crates/mangater-core"
readme = "README.md"

keywords = ["manga", "downloader", "engine", "async", "scraper"]
categories = ["network-programming"]

[lib]
name = "mangater_core"
path = "src/lib.rs"

[dependencies]
# internal dependency
mangater-sdk = { path = "../mangater-sdk" }

async-trait = "0.1.89"
thiserror = "2.0.18"
dotenvy = "0.15.7"
url = "2.5.8"
bytes = "1.11.1"
tokio = { version = "1.49.0", features = ["fs", "rt-multi-thread"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
json5 = "1.3.1"
tracing = "0.1.44"
futures = "0.3.32"
futures-util = "0.3.32"

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[features]
default = []

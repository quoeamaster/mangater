[package]
name = "mangater-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SDK for building manga source plugins for Mangater (traits, types, and interfaces)"

readme = "README.md"
repository = "https://github.com/quoeamaster/mangater/tree/main/crates/mangater-sdk"
homepage = "https://github.com/quoeamaster/mangater/tree/main/crates/mangater-sdk"
documentation = "https://crates.io/crates/mangater-sdk"
# https://docs.rs/mangater-sdk

keywords = ["manga", "sdk", "plugin", "scraper", "async"]
categories = ["api-bindings", "network-programming"]

[dependencies]
async-trait = "0.1.89"
futures = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.13.2", features = [ "stream"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1.44"

[dev-dependencies]

